# CI: formatação, validação, lint e plan a cada PR. O plan usa as credenciais
# temporárias do Learner Lab (secrets do repo) e é publicado como comentário.
name: CI

on:
  pull_request:
    branches: [homolog, main]

permissions:
  contents: read
  pull-requests: write

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: 'true'

defaults:
  run:
    working-directory: terraform

jobs:
  qualidade:
    name: fmt, validate e tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      - name: terraform init (sem backend)
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate -no-color

      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: tflint
        run: |
          tflint --init
          tflint --recursive --format compact

  plan:
    name: terraform plan
    needs: qualidade
    runs-on: ubuntu-latest
    # Só roda quando as credenciais do lab estiverem configuradas no repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
          terraform_wrapper: false

      - name: Credenciais AWS (Learner Lab)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=oficina-infra-k8s/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}" \
            -backend-config="encrypt=true"

      - name: terraform plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan \
            -var="habilitar_gateway=${{ vars.HABILITAR_GATEWAY || 'false' }}" \
            | tee plan.txt

      - name: Comentar plan no PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            const corpo = plan.length > 60000 ? plan.slice(-60000) : plan;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: `### terraform plan (${context.payload.pull_request.base.ref})\n\n<details><summary>saida</summary>\n\n\`\`\`\n${corpo}\n\`\`\`\n\n</details>`
            });
